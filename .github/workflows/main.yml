name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install

      - run: npx electron-packager . TimeForge --platform=win32 --arch=x64

      - uses: actions/upload-artifact@v4
        with:
          name: TimeForge
          path: TimeForge-win32-x64
